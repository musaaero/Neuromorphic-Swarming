[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromorphic-swarming"
version = "0.0.1.dev0"
description = "Brain-inspired drone-swarm simulation: LIF neurons, STDP, spike-based communication, energy accounting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Musab Umair" }, { name = "Contributors" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "matplotlib",
    "numba",
]
snn = [
    "bindsnet",
    "lava-nc",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
