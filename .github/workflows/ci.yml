name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        # xfail-strict tests act as the living to-do list:
        # implementing a stub turns its "expected failure" into a loud CI error until
        # you remove the xfail marker. Green suite == Phase 1 done.
        run: pytest -q
